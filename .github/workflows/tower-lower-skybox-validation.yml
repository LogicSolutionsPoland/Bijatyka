name: Tower lower skybox validation

on:
  push:
    branches:
      - codex/tower-lower-city-skybox-20261028
      - feat/zombie-fog-horizon-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skybox:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import scene and shaders
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' "$RUNNER_TEMP/godot-import.log"; then exit 1; fi

      - name: Verify horizon, flashlight, environment and gameplay regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in burning_horizon_test flashlight_visibility_test flashlight_enemy_reveal_test environment_render_test elevator_loading_test test_runner; do
            timeout 150s godot --headless --path game --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            grep -q 'PASS:' "$RUNNER_TEMP/$suite.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/$suite.log"; then exit 1; fi
          done

      - name: Render rooftop panorama, flashlight and environment under Compatibility
        shell: bash
        run: |
          set -euo pipefail
          for suite in zombie_fog_render_probe flashlight_render_probe flashlight_volume_test flashlight_beam_volume_test environment_render_probe; do
            timeout 150s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/$suite.log"; then exit 1; fi
          done
          grep -q 'PASS: flashlight Compatibility render mask' "$RUNNER_TEMP/flashlight_render_probe.log"
          grep -q 'PASS: zombie fog Compatibility pixels and motion' "$RUNNER_TEMP/zombie_fog_render_probe.log"
          grep -q 'PASS:' "$RUNNER_TEMP/flashlight_volume_test.log"
          grep -q 'PASS:' "$RUNNER_TEMP/flashlight_beam_volume_test.log"
