name: Horde and visibility validation

on:
  push:
    branches:
      - codex/zombie-horde-30m
      - codex/endless-invasion-40
      - codex/zombie-roaming-aggression
      - codex/concealed-forward-assault
      - codex/graphics-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import Godot project and assets
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load" "$RUNNER_TEMP/godot-import.log"; then exit 1; fi

      - name: Run gameplay checks
        run: |
          set -o pipefail
          godot --headless --path game --script res://tests/test_runner.gd 2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          grep -q "PASS: " "$RUNNER_TEMP/godot-tests.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/godot-tests.log"; then exit 1; fi

      - name: Check concealed spawning and assault handoff
        run: |
          set -o pipefail
          godot --headless --path game --script res://tests/concealed_spawn_test.gd 2>&1 | tee "$RUNNER_TEMP/concealed-spawns.log"
          grep -q "PASS: concealed spawn" "$RUNNER_TEMP/concealed-spawns.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/concealed-spawns.log"; then exit 1; fi

      - name: Check burning horizon integration
        run: |
          set -o pipefail
          godot --headless --path game --script res://tests/burning_horizon_test.gd 2>&1 | tee "$RUNNER_TEMP/horizon.log"
          grep -q "PASS: burning horizon integration" "$RUNNER_TEMP/horizon.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/horizon.log"; then exit 1; fi


  scene-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import Godot project and assets
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/smoke-import.log"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load" "$RUNNER_TEMP/smoke-import.log"; then exit 1; fi

      - name: Smoke-run the playable scene
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path game --quit-after 600 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/godot-smoke.log"; then exit 1; fi

  android-export:
    # Keep the concealed-spawn review branch validation-only; graphics branches export an APK.
    if: github.ref_name != 'codex/concealed-forward-assault'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Install Godot and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Verify Android build tools
        run: |
          set -eu
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          java -version
          godot --version
      - name: Import project and assets
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/android-import.log"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load" "$RUNNER_TEMP/android-import.log"; then exit 1; fi
      - name: Export Android ARM64 APK
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path game --export-debug "Android ARM64" "$GITHUB_WORKSPACE/build/Bijatyka-graphics-upgrade-arm64.apk" 2>&1 | tee "$RUNNER_TEMP/android-export.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/android-export.log"; then exit 1; fi
          test -s "$GITHUB_WORKSPACE/build/Bijatyka-graphics-upgrade-arm64.apk"
      - name: Upload playable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bijatyka-graphics-upgrade-arm64
          path: build/Bijatyka-graphics-upgrade-arm64.apk
          if-no-files-found: error
