name: Bijatyka no-shaft ARM64 debug APK
on:
  push:
    branches:
      - build/bijatyka-no-shaft-arm64-20261121
    paths:
      - .github/workflows/bijatyka-no-shaft-arm64-20261121.yml
permissions:
  contents: read
jobs:
  export-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          godot --version
          java -version
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Export debug ARM64 APK to /temp
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 0777 /temp
          godot --headless --path game --export-debug 'Android ARM64' /temp/Bijatyka-no-shaft-ARM64.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -s /temp/Bijatyka-no-shaft-ARM64.apk
      - name: Verify architecture, package and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=/temp/Bijatyka-no-shaft-ARM64.apk
          unzip -tqq "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'lib/arm64-v8a/libgodot_android.so' "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'assets/project.binary' "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'assets/scripts/flashlight_visibility.gdc' "$RUNNER_TEMP/apk-files.txt"
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/apk-files.txt"; then
            echo 'Unexpected non-ARM64 native library' >&2
            exit 1
          fi
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | grep -F "package: name='org.logicsolutionspoland.bijatyka'"
          "$(dirname "$aapt_bin")/apksigner" verify --verbose "$apk"
          sha256sum "$apk"
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Bijatyka-no-shaft-ARM64
          path: /temp/Bijatyka-no-shaft-ARM64.apk
          if-no-files-found: error
