name: Godot foundation validation
on:
  push:
    branches:
      - codex/retribution-godot-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Install the source-confirmed Godot version
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import Godot project and assets
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load" "$RUNNER_TEMP/godot-import.log"; then exit 1; fi
      - name: Run combat and progression checks
        run: |
          set -o pipefail
          godot --headless --path game --script res://tests/test_runner.gd 2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          grep -q "PASS: " "$RUNNER_TEMP/godot-tests.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/godot-tests.log"; then exit 1; fi
      - name: Smoke-run the playable scene
        run: |
          set -o pipefail
          godot --headless --path game --quit-after 150 2>&1 | tee "$RUNNER_TEMP/godot-smoke.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/godot-smoke.log"; then exit 1; fi
  android-export:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Install Godot and matching export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Verify Android build tools are available
        run: |
          set -eu
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          java -version
          godot --version
      - name: Import Godot project and assets
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/android-import.log"
          if grep -E "SCRIPT ERROR:|ERROR: Failed to load" "$RUNNER_TEMP/android-import.log"; then exit 1; fi
      - name: Export Android ARM64 debug package
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path game --export-debug "Android ARM64" "$GITHUB_WORKSPACE/build/retribution-mark-of-sin-arm64.apk" 2>&1 | tee "$RUNNER_TEMP/android-export.log"
          if grep -E "SCRIPT ERROR:|ERROR:" "$RUNNER_TEMP/android-export.log"; then exit 1; fi
          test -s "$GITHUB_WORKSPACE/build/retribution-mark-of-sin-arm64.apk"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: retribution-mark-of-sin-android-arm64
          path: build/retribution-mark-of-sin-arm64.apk
          if-no-files-found: error
