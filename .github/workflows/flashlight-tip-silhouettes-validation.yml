name: Bijatyka flashlight tip silhouettes validation

on:
  push:
    branches:
      - feat/jump-horde-stage1-20261105
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import the Compatibility project
        run: |
          set -euo pipefail
          mkdir -p flashlight-tip-ci
          godot --headless --editor --path game --import --quit 2>&1 | tee flashlight-tip-ci/import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' flashlight-tip-ci/import.log; then exit 1; fi
      - name: Run visual, gameplay, jump, and horde regressions
        run: |
          set -euo pipefail
          for test in flashlight_tip_silhouettes_test.gd flashlight_visibility_test.gd \
            flashlight_enemy_reveal_test.gd burning_horizon_test.gd test_runner.gd \
            jump_state_regression_test.gd ai_director_test.gd concealed_spawn_test.gd \
            zombie_20_optimization_test.gd; do
            timeout 180s godot --headless --path game --script "res://tests/$test" 2>&1 | tee "flashlight-tip-ci/$test.log"
            grep -q 'PASS:' "flashlight-tip-ci/$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "flashlight-tip-ci/$test.log"; then exit 1; fi
          done
      - name: Render the flashlight tip and existing Compatibility passes
        run: |
          set -euo pipefail
          for test in flashlight_tip_silhouette_render_probe.gd flashlight_render_probe.gd \
            flashlight_volume_test.gd flashlight_beam_volume_test.gd; do
            timeout 180s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy \
              --rendering-driver opengl3 --path game --script "res://tests/$test" \
              2>&1 | tee "flashlight-tip-ci/$test.log"
            grep -q 'PASS:' "flashlight-tip-ci/$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "flashlight-tip-ci/$test.log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashlight-tip-silhouettes-host-evidence
          path: flashlight-tip-ci/
          if-no-files-found: warn
