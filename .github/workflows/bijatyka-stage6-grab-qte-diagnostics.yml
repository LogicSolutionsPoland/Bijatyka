name: Bijatyka Stage 6 P1 Grab-QTE diagnostics (NO APK)

on:
  push:
    branches:
      - fix/bijatyka-stage6-grab-qte-android-20261109
    paths:
      - .github/workflows/bijatyka-stage6-grab-qte-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: bijatyka-stage6-p1-grab-qte
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose existing grab rig and QTE HUD — no Android export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch and verify frozen production source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert diagnostic branch and unchanged production code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/bijatyka-stage6-grab-qte-android-20261109"
          git diff --quiet f1989c8c675357427e2214796e14a5103f1cef01 HEAD -- game/scripts game/scenes game/shaders game/assets game/project.godot game/export_presets.cfg
          echo "P1_DIAGNOSTIC_BRANCH=$GITHUB_REF_NAME"
          echo "P1_DIAGNOSTIC_SHA=$(git rev-parse HEAD)"
          echo "P1_PRODUCTION_SOURCE_UNCHANGED=YES"
      - name: Install Godot 4.7.2 (no Android templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import and parse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage6-p1/logs build/stage6-p1/captures
          godot --version | tee build/stage6-p1/logs/godot-version.txt
          timeout 300s godot --headless --editor --path game --import --quit > build/stage6-p1/logs/import.log 2>&1
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' build/stage6-p1/logs/import.log; then
            tail -100 build/stage6-p1/logs/import.log; exit 1
          fi
          echo 'P1_IMPORT=PASS'
      - name: Established grab and QTE suites plus new HUD diagnostic
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          failed=0
          for suite in brutal_grab_state_machine_test brutal_grab_qte_test brutal_grab_limb_contact_test brutal_grab_real_rig_test stage6_grab_qte_hud_diagnostic_test; do
            log="build/stage6-p1/logs/$suite.log"
            if timeout 200s godot --headless --path game --script "res://tests/$suite.gd" > "$log" 2>&1 \
                && grep -q '^PASS:' "$log" \
                && ! grep -Eq '^FAIL:|^SCRIPT ERROR:|^ERROR:' "$log"; then
              echo "P1_TEST_PASS $suite"
              passed=$((passed + 1))
            else
              echo "P1_TEST_FAIL $suite"
              tail -100 "$log"
              failed=$((failed + 1))
            fi
          done
          printf 'P1_PASSED=%s\nP1_FAILED=%s\n' "$passed" "$failed" | tee build/stage6-p1/logs/summary.txt
          test "$passed" -eq 5
          test "$failed" -eq 0
      - name: Reproduce an ordinary zombie grab through production AI (never force a grab)
        shell: bash
        run: |
          set -euo pipefail
          log="build/stage6-p1/logs/stage6_p1_natural_grab_test.log"
          if timeout 300s godot --headless --path game --script res://tests/stage6_p1_natural_grab_test.gd > "$log" 2>&1 \
              && grep -q '^PASS: Stage6 P1 production natural AI grab/QTE' "$log" \
              && ! grep -Eq '^FAIL:|^SCRIPT ERROR:|^ERROR:' "$log"; then
            echo 'P1_NATURAL_AI_GRAB=PASS' | tee -a build/stage6-p1/logs/summary.txt
          else
            echo 'P1_NATURAL_AI_GRAB=FAIL' | tee -a build/stage6-p1/logs/summary.txt
            grep -E '^P1_NATURAL_(DIAG|SAMPLE)' "$log" | tail -25 || true
            tail -90 "$log"
            exit 1
          fi
      - name: Confirm Mesa Stage 5B grab transition visual regression
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          export BIJATYKA_CAPTURE_DIR="$PWD/build/stage6-p1/captures"
          timeout 360s xvfb-run -a godot --audio-driver Dummy --rendering-driver opengl3 \
            --path game --script res://tests/stage5b_step5_transition_probe.gd \
            > build/stage6-p1/logs/stage5b_step5_transition_probe.log 2>&1 || {
            tail -110 build/stage6-p1/logs/stage5b_step5_transition_probe.log
            exit 1
          }
          grep -q '^PASS: Stage5B Step5 real gameplay-transition render checks' build/stage6-p1/logs/stage5b_step5_transition_probe.log
          if grep -Eq '^FAIL:|^SCRIPT ERROR:|^ERROR:' build/stage6-p1/logs/stage5b_step5_transition_probe.log; then
            tail -100 build/stage6-p1/logs/stage5b_step5_transition_probe.log; exit 1
          fi
          test -s build/stage6-p1/captures/step5-grab-active.png
          test -s build/stage6-p1/captures/step5-ground-0.40.png
          echo 'P1_CONTROLLED_GL_TRANSITION=PASS' | tee -a build/stage6-p1/logs/summary.txt
      - name: Verify AI Director and jumping regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in ai_director_test jump_state_regression_test; do
            log="build/stage6-p1/logs/$suite.log"
            if timeout 200s godot --headless --path game --script "res://tests/$suite.gd" > "$log" 2>&1 \
                && grep -q '^PASS:' "$log" \
                && ! grep -Eq '^FAIL:|^SCRIPT ERROR:|^ERROR:' "$log"; then
              echo "P1_TEST_PASS $suite" | tee -a build/stage6-p1/logs/summary.txt
            else
              echo "P1_TEST_FAIL $suite" | tee -a build/stage6-p1/logs/summary.txt
              tail -75 "$log"
              exit 1
            fi
          done
      - name: Publish diagnostic logs and non-APK captures only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bijatyka-stage6-p1-grab-qte-diagnostics-no-apk
          path: |
            build/stage6-p1/logs/*
            build/stage6-p1/captures/*.png
          if-no-files-found: warn
          retention-days: 14
