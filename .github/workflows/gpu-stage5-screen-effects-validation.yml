name: Bijatyka GPU stage 5 screen effects validation

on:
  push:
    branches:
      - feat/gpu-stage5-screen-effects-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import the Compatibility project
        run: |
          set -euo pipefail
          mkdir -p stage5-ci/captures
          godot --headless --editor --path game --import --quit 2>&1 | tee stage5-ci/import.log
          # Both universal character GLBs report these existing duplicate
          # animation renames on a clean import. Keep any other error fatal.
          if grep -E 'SCRIPT ERROR:|ERROR:' stage5-ci/import.log | \
            grep -v -E 'ERROR: Animation name "(Idle|Jump|Sprint|Walk)" already exists in library\.'; then
            exit 1
          fi
      - name: Focused headless gameplay and visibility checks
        run: |
          set -euo pipefail
          for test in gpu_stage3_test.gd gpu_stage4_test.gd zombie_20_optimization_test.gd \
            flashlight_visibility_test.gd flashlight_enemy_reveal_test.gd elevator_loading_test.gd; do
            godot --headless --path game --script "res://tests/$test" 2>&1 | tee "stage5-ci/headless-$test.log"
            grep -q 'PASS:' "stage5-ci/headless-$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "stage5-ci/headless-$test.log"; then exit 1; fi
          done
      - name: Fixed 20-zombie effect matrix at 40 percent, host only
        run: |
          set -euo pipefail
          for mode in both mask pencil neither; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game \
              --script res://tests/gpu_stage4_benchmark.gd -- "--effects=$mode" 2>&1 | tee "stage5-ci/effects-$mode.log"
            grep -q 'STAGE5_EFFECT_SAMPLE' "stage5-ci/effects-$mode.log"
            grep -q 'PASS: Stage 4 fixed 20-zombie benchmark' "stage5-ci/effects-$mode.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "stage5-ci/effects-$mode.log"; then exit 1; fi
          done
      - name: Paired static-scene A/B, host only
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game \
            --script res://tests/gpu_stage5_effect_cycle.gd 2>&1 | tee stage5-ci/paired.log
          test "$(grep -c 'STAGE5_PAIRED_SAMPLE' stage5-ci/paired.log)" -eq 7
          grep -q 'PASS: Stage 5 paired 20-zombie screen-effect comparison' stage5-ci/paired.log
          if grep -E 'SCRIPT ERROR:|ERROR:' stage5-ci/paired.log; then exit 1; fi
      - name: Stage 4 versus optimized mask on the same 20-zombie frame
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 LP_NUM_THREADS=1 godot --audio-driver Dummy \
            --rendering-driver opengl3 --path game --script res://tests/gpu_stage5_mask_pair.gd \
            2>&1 | tee stage5-ci/mask-pair.log
          test "$(grep -c 'STAGE5_MASK_PAIR' stage5-ci/mask-pair.log)" -eq 6
          grep -q 'PASS: Stage 5 paired Stage 4 and optimized flashlight masks' stage5-ci/mask-pair.log
          if grep -E 'SCRIPT ERROR:|ERROR:' stage5-ci/mask-pair.log; then exit 1; fi
      - name: Rendered shader, roof, beam, enemy, boss, and wall probes
        run: |
          set -euo pipefail
          for test in gpu_stage4_test.gd flashlight_render_probe.gd flashlight_beam_volume_test.gd \
            flashlight_enemy_render_probe.gd flashlight_boss_render_probe.gd; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game \
              --script "res://tests/$test" 2>&1 | tee "stage5-ci/render-$test.log"
            grep -q 'PASS:' "stage5-ci/render-$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "stage5-ci/render-$test.log"; then exit 1; fi
          done
          BIJATYKA_CAPTURE_DIR="$PWD/stage5-ci/captures" xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot \
            --audio-driver Dummy --rendering-driver opengl3 --path game \
            --script res://tests/gpu_stage5_visual_capture.gd 2>&1 | tee stage5-ci/captures.log
          grep -q 'PASS: Stage 5 fixed roof and ground captures' stage5-ci/captures.log
          if grep -E 'SCRIPT ERROR:|ERROR:' stage5-ci/captures.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-stage5-screen-effects-evidence
          path: stage5-ci/
          if-no-files-found: warn
