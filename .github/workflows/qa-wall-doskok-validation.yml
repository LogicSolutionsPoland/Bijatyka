name: Bijatyka QA blocked chain approach (NO APK)

on:
  push:
    branches:
      - qa/stage1-wall-doskok-20261108
    paths:
      - .github/workflows/qa-wall-doskok-validation.yml
      - game/tests/cinematic_chain_wall_trace.gd
      - game/tests/cinematic_chain_physics_test.gd
      - game/scripts/player_controller.gd

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout test-only branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Assert edits are limited to the blocked-grapple fix and QA tests
        shell: bash
        run: |
          set -euo pipefail
          BASE=ac12a215d95ce85d982f68b469aea99e75542883
          echo "QA_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse "$BASE")" = "$BASE"
          git diff --name-only "$BASE" HEAD
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/qa-wall-doskok-validation.yml|game/scripts/player_controller.gd|game/tests/cinematic_chain_physics_test.gd|game/tests/cinematic_chain_wall_trace.gd) ;;
              *) echo "ERROR: Unauthorized changed path: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          test "$(git diff --name-only "$BASE" HEAD -- game/scripts)" = "game/scripts/player_controller.gd"
          echo "PASS: only one gameplay script and the narrow QA tests/workflow changed"

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/qa-import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' "$RUNNER_TEMP/qa-import.log"; then exit 1; fi

      - name: Run blocked-grapple regression, diagnostic trace and adjacent gameplay suites
        shell: bash
        run: |
          set +e
          failures=0
          for test in cinematic_chain_physics_test.gd cinematic_chain_wall_trace.gd test_runner.gd concealed_spawn_test.gd; do
            logfile="$RUNNER_TEMP/$test.log"
            timeout 120s godot --headless --path game --script "res://tests/$test" > "$logfile" 2>&1
            code=$?
            cat "$logfile"
            if [ "$code" -ne 0 ] || grep -Eq 'SCRIPT ERROR:|^ERROR:|^FAIL:' "$logfile" || ! grep -q 'PASS:' "$logfile"; then
              echo "QA_TEST_FAIL $test code=$code"
              failures=$((failures + 1))
            else
              echo "QA_TEST_PASS $test"
            fi
          done
          echo "QA_TEST_FAILURES=$failures"
          test "$failures" -eq 0

      - name: Smoke-run playable scene for 600 frames
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --fixed-fps 60 --path game --quit-after 600 2>&1 | tee "$RUNNER_TEMP/qa-scene-smoke.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/qa-scene-smoke.log"; then exit 1; fi
