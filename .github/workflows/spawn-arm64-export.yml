name: Bijatyka spawn system ARM64

on:
  push:
    branches:
      - codex/fix-spawn-system-20261029

permissions:
  contents: read

jobs:
  spawn-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and Android templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: |
          set -o pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Verify spawn, controls, and camera
        run: |
          set -euo pipefail
          for suite in test_runner concealed_spawn_test flashlight_visibility_test burning_horizon_test; do
            godot --headless --path game --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            grep -q 'PASS:' "$RUNNER_TEMP/$suite.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/$suite.log"; then exit 1; fi
          done
          godot --headless --fixed-fps 60 --path game --quit-after 240 2>&1 | tee "$RUNNER_TEMP/scene-smoke.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/scene-smoke.log"; then exit 1; fi

      - name: Export one Android ARM64 debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path game --export-debug 'Android ARM64' "$GITHUB_WORKSPACE/build/Bijatyka-Spawn-Fix-ARM64.apk" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR:|ERROR:' "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -s build/Bijatyka-Spawn-Fix-ARM64.apk

      - name: Verify APK content and package
        run: |
          set -euo pipefail
          apk=build/Bijatyka-Spawn-Fix-ARM64.apk
          unzip -tqq "$apk"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-files.txt"
          for entry in lib/arm64-v8a/libgodot_android.so assets/project.binary \
            assets/scripts/concealed_spawn.gdc assets/scripts/foundation.gdc \
            assets/scripts/starting_elevator.gdc assets/scripts/player_controller.gdc; do
            grep -Fxq "$entry" "$RUNNER_TEMP/apk-files.txt"
            test "$(unzip -p "$apk" "$entry" | wc -c)" -gt 0
          done
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' "$RUNNER_TEMP/apk-files.txt"; then exit 1; fi
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$aapt_bin" dump badging "$apk" | grep -q "package: name='org.logicsolutionspoland.bijatyka'"

      - name: Upload raw APK
        uses: actions/upload-artifact@v4
        with:
          name: Bijatyka-Spawn-Fix-ARM64
          path: build/Bijatyka-Spawn-Fix-ARM64.apk
          if-no-files-found: error
