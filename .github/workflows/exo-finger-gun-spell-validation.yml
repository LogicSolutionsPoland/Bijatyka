name: Exo finger gun spell gameplay and visual regression (NO APK)

on:
  push:
    branches:
      - feat/exo-finger-gun-spell-integration-20261031
    paths:
      - game/**
      - .github/workflows/exo-finger-gun-spell-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finger-spell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import Exo Gray and all scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path game --import --quit 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' import.log; then exit 1; fi
      - name: Finger gun actual spell casting, hit and marker validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path game --script res://tests/finger_gun_spell_integration_test.gd 2>&1 | tee spell-integration.log
          grep -q 'PASS: Finger Gun gameplay spell integration' spell-integration.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|FINGER_GUN_INTEGRATION_FAILED|ERROR: Failed to load' spell-integration.log; then exit 1; fi
      - name: Original finger gun rig validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path game --script res://tests/finger_gun_validation.gd 2>&1 | tee finger-rig.log
          grep -q 'PASS: Finger Gun Shoot Exo rig' finger-rig.log
      - name: Existing gameplay, combat and model regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path game --script res://tests/player_animation_test.gd 2>&1 | tee player-animation.log
          grep -q 'PASS: player martial animation' player-animation.log
          timeout 120s godot --headless --path game --script res://tests/player_character_quality_test.gd 2>&1 | tee exo-quality.log
          grep -q 'PASS: Exo Gray player model' exo-quality.log
          timeout 120s godot --headless --path game --script res://tests/test_runner.gd 2>&1 | tee core-tests.log
          grep -q 'PASS:' core-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|FINGER_GUN_INTEGRATION_FAILED|ERROR: Failed to load' player-animation.log exo-quality.log core-tests.log; then exit 1; fi
      - name: Capture six actual Exo poses from rear and side (software GL)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          timeout 90s env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --path game --rendering-method gl_compatibility --script res://tests/finger_gun_spell_capture.gd 2>&1 | tee finger-gun-captures.log
          grep -q 'FINGER_GUN_CAPTURED=6 ERRORS=0' finger-gun-captures.log
          test "$(find build/finger_gun_spell_review -type f -name '*.png' | wc -l)" -eq 6
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' finger-gun-captures.log; then exit 1; fi
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finger-gun-spell-validation-logs
          path: |
            import.log
            spell-integration.log
            finger-rig.log
            player-animation.log
            exo-quality.log
            core-tests.log
            finger-gun-captures.log
            build/finger_gun_spell_review/*.png
          if-no-files-found: warn
