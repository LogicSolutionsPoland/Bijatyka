name: Bijatyka GPU stage 4 validation

on:
  push:
    branches:
      - feat/gpu-stage4-android-resources-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import resources in Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p stage4-ci
          godot --headless --editor --path game --import --quit 2>&1 | tee stage4-ci/import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' stage4-ci/import.log; then exit 1; fi
      - name: Fixed 20-zombie baseline or comparison, headless CPU
        run: |
          set -euo pipefail
          godot --headless --path game --script res://tests/gpu_stage4_benchmark.gd 2>&1 | tee stage4-ci/headless-20.log
          grep -q 'PASS: Stage 4 fixed 20-zombie benchmark' stage4-ci/headless-20.log
          if grep -E 'SCRIPT ERROR:|ERROR:' stage4-ci/headless-20.log; then exit 1; fi
      - name: Gameplay, zombie, elevator and GPU invariants
        run: |
          set -euo pipefail
          for test in \
            gpu_stage4_test.gd gpu_stage3_test.gd full_gameplay_smoke_test.gd \
            zombie_20_optimization_test.gd dormant_visuals_test.gd \
            rig_budget_lifecycle_test.gd horde_performance_test.gd \
            concealed_spawn_test.gd elevator_loading_test.gd \
            flashlight_visibility_test.gd environment_render_test.gd \
            burning_horizon_test.gd runtime_creation_test.gd \
            enemy_attack_animation_test.gd player_animation_test.gd test_runner.gd; do
            godot --headless --path game --script "res://tests/$test" 2>&1 | tee "stage4-ci/$test.log"
            grep -q 'PASS:' "stage4-ci/$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "stage4-ci/$test.log"; then exit 1; fi
          done
      - name: Fixed 20-zombie baseline or comparison, desktop software OpenGL
        run: |
          set -euo pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game --script res://tests/gpu_stage4_benchmark.gd 2>&1 | tee stage4-ci/software-20.log
          grep -q 'PASS: Stage 4 fixed 20-zombie benchmark' stage4-ci/software-20.log
          if grep -E 'SCRIPT ERROR:|ERROR:' stage4-ci/software-20.log; then exit 1; fi
      - name: Compatibility shader and pixel regressions, desktop software OpenGL
        run: |
          set -euo pipefail
          for test in gpu_stage4_test.gd environment_render_probe.gd flashlight_render_probe.gd flashlight_beam_volume_test.gd flashlight_boss_render_probe.gd; do
            xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game --script "res://tests/$test" 2>&1 | tee "stage4-ci/render-$test.log"
            if grep -E 'SCRIPT ERROR:|ERROR:' "stage4-ci/render-$test.log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-stage4-validation-logs
          path: stage4-ci/*.log
          if-no-files-found: warn
