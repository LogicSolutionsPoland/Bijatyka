name: Bijatyka Stage 5/5B safe feature integration verification (NO APK)

on:
  push:
    branches:
      - integration/bijatyka-stage5-complete-20261109
      - integration/bijatyka-stage5b-blackout-fog-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Godot 4.7.2 integration tests (NO APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact integration commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import resources and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage5
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          timeout 300s godot --headless --editor --path game --import --quit 2>&1 | tee build/stage5/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR: Failed to load' build/stage5/import.log; then exit 1; fi
      - name: Gameplay, visuals, controls, zombie systems and CPU regressions
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          for suite in \
            stage4_character_only_test stage4_melee_lunge_test \
            cinematic_chain_physics_test jump_state_regression_test \
            brutal_grab_state_machine_test brutal_grab_qte_test \
            brutal_grab_limb_contact_test brutal_grab_real_rig_test \
            test_runner player_animation_test \
            concealed_spawn_test ai_director_test \
            elevator_loading_test stage6_integrated_headless_test \
            flashlight_visibility_test flashlight_enemy_reveal_test \
            general_cpu_optimization_test rig_budget_lifecycle_test \
            environment_render_test stage5_visibility_regression_test; do
            log="build/stage5/${suite}.log"
            timeout 180s godot --headless --path game --script "res://tests/${suite}.gd" > "${log}" 2>&1
            code=$?
            cat "${log}"
            if [ "${code}" -ne 0 ] || grep -Eq '^SCRIPT ERROR:|^ERROR:|^FAIL:' "${log}" || ! grep -q 'PASS:' "${log}"; then
              echo "STAGE5_FAIL ${suite} exit=${code}"
              failures=$((failures+1))
            else
              echo "STAGE5_PASS ${suite}"
            fi
          done
          echo "STAGE5_FAILED_SUITES=${failures}"
          test "${failures}" -eq 0
      - name: Smoke-run playable scene for 600 frames
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s godot --headless --fixed-fps 60 --path game --quit-after 600 2>&1 | tee build/stage5/scene-smoke.log
          if grep -Eq 'SCRIPT ERROR:|^ERROR:' build/stage5/scene-smoke.log; then exit 1; fi
      - name: Render actual flashlight geometry under Mesa software OpenGL
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game --script res://tests/flashlight_beam_volume_test.gd 2>&1 | tee build/stage5/flashlight-gl.log
          grep -q 'PASS:' build/stage5/flashlight-gl.log
          if grep -Eq '^SCRIPT ERROR:|^ERROR:|^FAIL:' build/stage5/flashlight-gl.log; then exit 1; fi
      - name: Capture and verify real ground blackout and rooftop pixels (Mesa OpenGL, NO APK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stage5/captures
          BIJATYKA_CAPTURE_DIR="$PWD/build/stage5/captures" timeout 180s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --audio-driver Dummy --rendering-driver opengl3 --path game --script res://tests/flashlight_render_probe.gd 2>&1 | tee build/stage5/blackout-gl.log
          grep -q 'PASS: flashlight Compatibility render mask' build/stage5/blackout-gl.log
          if grep -Eq '^SCRIPT ERROR:|^ERROR:|^FAIL:' build/stage5/blackout-gl.log; then exit 1; fi
          test -s build/stage5/captures/rooftop-no-blackout.png
          test -s build/stage5/captures/ground-blackout-0.40.png
      - name: Paired pre/post visibility CPU samples (host only)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          baseline="$RUNNER_TEMP/bijatyka-stage5-before"
          git worktree add --detach "$baseline" 86ddc8cdb8e883a83f0b8978e7f94f69df27f3b0
          cp game/tests/scene_visibility_benchmark.gd "$baseline/game/tests/scene_visibility_benchmark.gd"
          (cd "$baseline" && timeout 300s godot --headless --editor --path game --import --quit && timeout 180s godot --headless --fixed-fps 60 --path game --script res://tests/scene_visibility_benchmark.gd) > build/stage5/visibility-before.log 2>&1
          before_status=$?
          timeout 180s godot --headless --fixed-fps 60 --path game --script res://tests/scene_visibility_benchmark.gd > build/stage5/visibility-after.log 2>&1
          after_status=$?
          cat build/stage5/visibility-before.log build/stage5/visibility-after.log
          echo "VISIBILITY_BENCH_BASELINE_RC=${before_status} STAGE5_RC=${after_status}"
          test "${before_status}" -eq 0 && test "${after_status}" -eq 0
          grep -q 'VISIBILITY_CPU_SAMPLE' build/stage5/visibility-before.log
          grep -q 'VISIBILITY_CPU_SAMPLE' build/stage5/visibility-after.log
      - name: Keep QA logs only; never export or publish APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bijatyka-stage5-no-apk-qa-logs
          path: |
            build/stage5/*.log
            build/stage5/captures/*.png
          if-no-files-found: warn
